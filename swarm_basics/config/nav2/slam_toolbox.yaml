slam_toolbox:
  ros__parameters:
    # Solver
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_alpha: 0.1
    ceres_quadratic_alpha: 0.1
    ceres_scan_k: 10
    ceres_initial_alpha: 0.1

    # Scan matching
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 5.0

    # Map
    map_update_interval: 0.5
    resolution: 0.05
    max_laser_range: 10.0

    # No angle filtering — use the scan's full angular range
    use_scan_subset: false
    transform_timeout: 2.0
    scan_topic: /robot_0/scan
    publish_scan_on_map: true