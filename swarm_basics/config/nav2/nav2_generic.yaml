# Generic Nav2 config for multi-robot swarm.
# Robot-specific frame names are overridden by the launch file.
# Used by: nav2_slam_all.launch.py

/**:
  ros__parameters:
    use_sim_time: True

    # ---- Planner ----
    planner_plugins: ["GridBased"]
    GridBased.plugin: "nav2_navfn_planner/NavfnPlanner"
    GridBased.tolerance: 0.5
    GridBased.use_astar: True
    GridBased.allow_unknown: True

    # ---- Controller ----
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker.plugin: "nav2_controller::SimpleProgressChecker"
    progress_checker.required_movement_radius: 0.5
    progress_checker.movement_time_allowance: 10.0
    general_goal_checker.plugin: "nav2_controller::SimpleGoalChecker"
    general_goal_checker.stateful: True
    general_goal_checker.xy_goal_tolerance: 0.25
    general_goal_checker.yaw_goal_tolerance: 0.25
    FollowPath.plugin: "dwb_core::DWBLocalPlanner"
    FollowPath.debug_trajectory_details: True
    FollowPath.min_vel_x: 0.0
    FollowPath.min_vel_y: 0.0
    FollowPath.max_vel_x: 0.26
    FollowPath.max_vel_y: 0.0
    FollowPath.max_vel_theta: 1.0
    FollowPath.min_speed_xy: 0.0
    FollowPath.max_speed_xy: 0.26
    FollowPath.min_speed_theta: 0.0
    FollowPath.acc_lim_x: 2.5
    FollowPath.acc_lim_y: 0.0
    FollowPath.acc_lim_theta: 3.2
    FollowPath.decel_lim_x: -2.5
    FollowPath.decel_lim_y: 0.0
    FollowPath.decel_lim_theta: -3.2
    FollowPath.vx_samples: 20
    FollowPath.vy_samples: 5
    FollowPath.vtheta_samples: 20
    FollowPath.sim_time: 1.7
    FollowPath.linear_granularity: 0.05
    FollowPath.angular_granularity: 0.025
    FollowPath.transform_tolerance: 0.2
    FollowPath.critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
    FollowPath.BaseObstacle.scale: 2.0
    FollowPath.PathAlign.scale: 10.0
    FollowPath.PathAlign.forward_point_distance: 0.1
    FollowPath.GoalAlign.scale: 12.0
    FollowPath.GoalAlign.forward_point_distance: 0.1
    FollowPath.PathDist.scale: 12.0
    FollowPath.GoalDist.scale: 12.0
    FollowPath.RotateToGoal.scale: 32.0
    FollowPath.RotateToGoal.slowing_factor: 5.0
    FollowPath.RotateToGoal.lookahead_time: -1.0

    # ---- BT Navigator ----
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_rate_controller_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_remove_passed_goals_action_bt_node

    # ---- Behavior Server ----
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait", "drive_on_heading", "assisted_teleop"]
    spin.plugin: "nav2_behaviors/Spin"
    backup.plugin: "nav2_behaviors/BackUp"
    wait.plugin: "nav2_behaviors/Wait"
    drive_on_heading.plugin: "nav2_behaviors/DriveOnHeading"
    assisted_teleop.plugin: "nav2_behaviors/AssistedTeleop"
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# ===== Global Costmap (shared map, per-robot frames set by launch) =====
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      robot_radius: 0.3
      resolution: 0.05
      rolling_window: False
      width: 20
      height: 20
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: "/map"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35

# ===== Local Costmap (used by both planner and controller) =====
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      robot_radius: 0.3
      resolution: 0.05
      rolling_window: True
      width: 5
      height: 5
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
