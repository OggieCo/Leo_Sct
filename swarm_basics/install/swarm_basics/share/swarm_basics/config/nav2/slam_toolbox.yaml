slam_toolbox:
  ros__parameters:
    # Solver
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_alpha: 0.1
    ceres_quadratic_alpha: 0.1
    ceres_scan_k: 10
    ceres_initial_alpha: 0.1

    # Scan matching
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 5.0

    # Map
    map_update_interval: 0.5
    resolution: 0.05
    max_laser_range: 10.0

    # Frames (overridden per robot in launch)
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    laser_frame: lidar_link