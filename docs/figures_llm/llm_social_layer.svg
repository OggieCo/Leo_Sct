<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ===================== PERCEPTION ===================== -->
  <g>
    <rect x="40" y="40" width="350" height="76" rx="8" fill="#eef4fb" stroke="#6f9fd8" stroke-width="1.5"/>
    <text x="215" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">Human detector (YOLO)</text>
    <text x="215" y="90" text-anchor="middle" font-size="11.5" fill="#1f2937">human_detected, human_close,</text>
    <text x="215" y="106" text-anchor="middle" font-size="11.5" fill="#1f2937">human_distance, human_angle</text>

    <rect x="430" y="40" width="350" height="76" rx="8" fill="#eef4fb" stroke="#6f9fd8" stroke-width="1.5"/>
    <text x="605" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">Robot proximity</text>
    <text x="605" y="90" text-anchor="middle" font-size="11.5" fill="#1f2937">nearest_robot_dist, robot_angle</text>
    <text x="605" y="106" text-anchor="middle" font-size="11.5" fill="#1f2937">(distance and bearing of nearest rover)</text>

    <rect x="820" y="40" width="380" height="76" rx="8" fill="#eef4fb" stroke="#6f9fd8" stroke-width="1.5"/>
    <text x="1010" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">LiDAR scan</text>
    <text x="1010" y="90" text-anchor="middle" font-size="11.5" fill="#1f2937">free space ahead,</text>
    <text x="1010" y="106" text-anchor="middle" font-size="11.5" fill="#1f2937">rear sector for reversing</text>

    <line x1="215" y1="116" x2="215" y2="140" stroke="#8a8a8a" stroke-width="1.4"/>
    <line x1="605" y1="116" x2="605" y2="140" stroke="#8a8a8a" stroke-width="1.4"/>
    <line x1="1010" y1="116" x2="1010" y2="140" stroke="#8a8a8a" stroke-width="1.4"/>
    <line x1="215" y1="140" x2="1010" y2="140" stroke="#8a8a8a" stroke-width="2"/>
    <line x1="235" y1="140" x2="235" y2="206" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arw)"/>
  </g>

  <!-- ===================== LLM_PLANNER ===================== -->
  <g>
    <rect x="40" y="168" width="760" height="400" rx="14" fill="#f7fbf7" stroke="#77b077" stroke-width="1.6"/>
    <text x="420" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">llm_planner — ROS 2 node (4 Hz evaluation loop)</text>

    <rect x="70" y="210" width="330" height="70" rx="8" fill="#ffffff" stroke="#77b077" stroke-width="1.5"/>
    <text x="235" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Situation signature — 13 parameters</text>
    <text x="235" y="260" text-anchor="middle" font-size="11.5" fill="#1f2937">updated at 4 Hz and compared with the previous tick</text>

    <line x1="235" y1="280" x2="235" y2="296" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arw)"/>

    <rect x="70" y="300" width="330" height="150" rx="8" fill="#ffffff" stroke="#77b077" stroke-width="1.5"/>
    <text x="235" y="322" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Five gates — all must pass:</text>
    <text x="235" y="344" text-anchor="middle" font-size="12" fill="#1f2937">G1  arc maneuver in flight?</text>
    <text x="235" y="362" text-anchor="middle" font-size="12" fill="#1f2937">G2  robot or human present?</text>
    <text x="235" y="380" text-anchor="middle" font-size="12" fill="#1f2937">G3  signature changed?</text>
    <text x="235" y="398" text-anchor="middle" font-size="12" fill="#1f2937">G4  ≥ 2.5 s since the last call?</text>
    <text x="235" y="416" text-anchor="middle" font-size="12" fill="#1f2937">G5  worker thread idle?</text>

    <text x="420" y="418" font-size="11" font-style="italic" fill="#555555">If any gate fails, no model call is made:</text>
    <text x="420" y="433" font-size="11" font-style="italic" fill="#555555">the previous decision remains in force</text>
    <text x="420" y="448" font-size="11" font-style="italic" fill="#555555">(or proceed / Path clear when nothing is present).</text>

    <line x1="235" y1="450" x2="235" y2="466" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arw)"/>

    <rect x="70" y="470" width="330" height="68" rx="8" fill="#ffffff" stroke="#77b077" stroke-width="1.5"/>
    <text x="235" y="497" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">API request in worker thread</text>
    <text x="235" y="517" text-anchor="middle" font-size="11.5" fill="#1f2937">(non-blocking; one call at a time)</text>

    <rect x="460" y="330" width="310" height="68" rx="8" fill="#fdf6e0" stroke="#cfa84f" stroke-width="1.5"/>
    <text x="615" y="357" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Decision log (CSV)</text>
    <text x="615" y="377" text-anchor="middle" font-size="11.5" fill="#1f2937">action, reason, tokens, cost</text>

    <rect x="460" y="470" width="310" height="68" rx="8" fill="#f4ecfb" stroke="#9b7fc9" stroke-width="1.5"/>
    <text x="615" y="497" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Publish llm_action / llm_reason</text>
    <text x="615" y="517" text-anchor="middle" font-size="11.5" fill="#1f2937">(action + one-line reason)</text>

    <line x1="615" y1="470" x2="615" y2="404" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arw)"/>
    <text x="622" y="440" font-size="10.5" fill="#555555">logged</text>
  </g>

  <!-- ===================== CLOUD ===================== -->
  <g>
    <rect x="880" y="455" width="320" height="110" rx="18" fill="#fdf6e3" stroke="#d9b26a" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="1040" y="496" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">OpenAI API — GPT-4o mini</text>
    <text x="1040" y="516" text-anchor="middle" font-size="11.5" fill="#1f2937">cloud-hosted, stateless call per decision</text>
    <text x="1040" y="534" text-anchor="middle" font-size="11.5" fill="#1f2937">temperature 0, max 80 output tokens</text>

    <path d="M 235,538 V 556 H 872" fill="none" stroke="#4a4a4a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arw)"/>
    <text x="640" y="549" text-anchor="middle" font-size="11" fill="#1f2937">request: system prompt + situation report</text>

    <path d="M 880,480 H 774" fill="none" stroke="#4a4a4a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arw)"/>
    <text x="827" y="471" text-anchor="middle" font-size="11" fill="#1f2937">response (JSON)</text>
  </g>

  <!-- ===================== BLACKBOARD + BEHAVIOUR TREE ===================== -->
  <g>
    <path d="M 615,538 V 590 H 205 V 614" fill="none" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arw)"/>

    <rect x="40" y="620" width="330" height="76" rx="8" fill="#f4ecfb" stroke="#9b7fc9" stroke-width="1.5"/>
    <text x="205" y="652" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">CheckLlmAction → blackboard</text>
    <text x="205" y="672" text-anchor="middle" font-size="11.5" fill="#1f2937">action + reason stored for the tree</text>

    <line x1="370" y1="658" x2="414" y2="658" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arw)"/>

    <rect x="420" y="600" width="500" height="110" rx="8" fill="#f4ecfb" stroke="#9b7fc9" stroke-width="1.5"/>
    <text x="670" y="628" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">social_nav.xml behaviour tree</text>
    <text x="670" y="650" text-anchor="middle" font-size="12" fill="#1f2937">1  robot-avoid arc (highest priority)</text>
    <text x="670" y="668" text-anchor="middle" font-size="12" fill="#1f2937">2  LLM branch — seven actions (Table 3.1)</text>
    <text x="670" y="686" text-anchor="middle" font-size="12" fill="#1f2937">3  reactive rules — fallback when no match</text>

    <text x="945" y="626" font-size="11" font-style="italic" fill="#555555">Arc / BackUp bypass the adaptor:</text>
    <text x="945" y="642" font-size="11" font-style="italic" fill="#555555">they publish directly to cmd_vel.</text>
  </g>

  <!-- ===================== ACTUATION ===================== -->
  <g>
    <path d="M 470,710 V 748 H 190 V 774" fill="none" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arw)"/>
    <text x="330" y="741" text-anchor="middle" font-size="11" fill="#1f2937">FollowPath</text>

    <path d="M 870,710 V 748 H 965 V 774" fill="none" stroke="#4a4a4a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arw)"/>
    <text x="988" y="743" font-size="11" fill="#1f2937">Arc / BackUp: direct</text>

    <rect x="40" y="780" width="300" height="76" rx="8" fill="#f1f1f1" stroke="#8a8a8a" stroke-width="1.5"/>
    <text x="190" y="812" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">DWB controller (via FollowPath)</text>
    <text x="190" y="832" text-anchor="middle" font-size="11.5" fill="#1f2937">publishes cmd_vel_social</text>

    <line x1="340" y1="818" x2="414" y2="818" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arw)"/>
    <text x="380" y="809" text-anchor="middle" font-size="10.5" fill="#1f2937">cmd_vel_social</text>

    <rect x="420" y="780" width="330" height="76" rx="8" fill="#f1f1f1" stroke="#8a8a8a" stroke-width="1.5"/>
    <text x="585" y="808" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">velocity adaptor</text>
    <text x="585" y="826" text-anchor="middle" font-size="11.5" fill="#1f2937">scales commands by proximity</text>
    <text x="585" y="842" text-anchor="middle" font-size="11.5" fill="#1f2937">(humans, rovers) and by the LLM cap</text>

    <line x1="750" y1="818" x2="824" y2="818" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arw)"/>

    <rect x="830" y="780" width="270" height="76" rx="8" fill="#f1f1f1" stroke="#8a8a8a" stroke-width="1.5"/>
    <text x="965" y="812" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">cmd_vel</text>
    <text x="965" y="832" text-anchor="middle" font-size="11.5" fill="#1f2937">rover wheels</text>
  </g>
</svg>
